services:

  flask:
    build: .
    container_name: flask-app

    ports:
      - "5000:5000"

    restart: unless-stopped

    depends_on:
      - mysql

  mysql:
    image: mysql:latest
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: flaskdb

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql-data:
