<!DOCTYPE html>
<html>
<head>
    <title>Employeess Login</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            font-family:Arial, sans-serif;
        }

        .login-box{

            width:350px;
            background:white;
            margin:120px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 10px 25px rgba(0,0,0,.3);

        }

        h1{
            text-align:center;
            color:#333;
        }

        input{

            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;

        }

        button{

            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;

        }

        button:hover{

            background:#0056b3;

        }

    </style>

</head>

<body>

<div class="login-box">

<h1>Employee Login</h1>

<form action="/login" method="POST">

<label>Username</label>

<input type="text" name="username" placeholder="Enter Username" required>

<label>Password</label>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
