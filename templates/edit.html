<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:400px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:15px 0;
        }

        button{
            background:orange;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Edit Employee</h2>

<form action="/update/{{employee[0]}}" method="POST">

<input
type="text"
name="name"
value="{{employee[1]}}"
required>

<button type="submit">Update Employee</button>

</form>

</div>

</body>
</html>
